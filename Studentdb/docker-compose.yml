version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: vanraj_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vanraj_hotel}
      POSTGRES_USER: ${POSTGRES_USER:-vanraj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vanraj_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vanraj}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vanraj_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-vanraj_hotel}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-vanraj}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-vanraj_secret}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    container_name: vanraj_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  pgdata:
