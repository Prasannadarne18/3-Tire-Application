# VanRaj Hotel — Spring Boot configuration
# Override via environment variables in docker-compose

spring.application.name=vanraj-hotel

# DataSource (overridden by docker-compose env vars)
spring.datasource.url=jdbc:postgresql://localhost:5432/vanraj_hotel
spring.datasource.username=vanraj
spring.datasource.password=vanraj_secret
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# CORS — allows the React dev server and production Nginx to call this API
vanraj.cors.allowed-origins=http://localhost:3000,http://localhost:5173
